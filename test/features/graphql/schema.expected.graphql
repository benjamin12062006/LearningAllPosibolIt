type ApiError {
  code: String!
  field: String
  message: LocalizedMessage!
  requestId: String
  sourceRow: Int
}

type ChangeCounts {
  added: Int!
  modified: Int!
  removed: Int!
  unchanged: Int!
}

type ChangedField {
  field: String!
  productCount: Int!
}

enum ChannelProfile {
  google_merchant
}

enum ConfigurationStatus {
  ready
  required
}

input CreateProjectInput {
  channelProfile: ChannelProfile!
  country: String!
  currency: String!
  name: String!
}

type Evaluation {
  attention: EvaluationAttention!
  counts: EvaluationCounts
  createdAt: String!
  finishedAt: String
  id: ID!
  resultChecksum: String
  rulesetRevision: Int!
  snapshotId: ID!
  status: String!
}

type EvaluationAttention {
  affectedProducts: Int!
  excludedProducts: Int!
  exclusionGroups: [ExclusionGroup!]!
  problemGroups: [ProblemGroup!]!
}

type EvaluationCounts {
  excluded: Int!
  invalid: Int!
  total: Int!
  valid: Int!
}

type ExclusionGroup {
  productCount: Int!
  rule: JSON
  rulePosition: Int!
}

type ExportSummary {
  createdAt: String!
  evaluationId: ID!
  id: ID!
  rowCount: Int!
}

type Feed {
  comparison(change: ProductChangeKind, exportId: ID!, limit: Int! = 20, offset: Int! = 0): FeedComparison!
  createdAt: String!
  delivery: FeedDelivery!
  deliveryEnabled: Boolean!
  generation: Int!
  id: ID!
  publishedVersion: FeedPublishedVersion
  updatedAt: String!
}

type FeedComparison {
  candidate: ExportSummary!
  changedFields: [ChangedField!]!
  changes: [ProductChange!]!
  counts: ChangeCounts!
  page: PageInfo!
}

type FeedDelivery {
  delivering: Boolean!
  deliveryEnabled: Boolean!
  reason: String
}

type FeedPublishedVersion {
  byteSize: Int!
  evaluationId: ID
  exportId: ID
  id: ID!
  publishedAt: String!
  publishedBy: String!
  rowCount: Int!
  tsvChecksum: String!
}

enum ImportDelimiter {
  comma
  semicolon
}

type ImportJob {
  createdAt: String!
  error: ApiError
  finishedAt: String
  id: ID!
  processedRows: Int!
  projectId: ID!
  snapshotId: ID!
  startedAt: String
  status: ImportJobStatus!
}

enum ImportJobStatus {
  failed
  queued
  running
  succeeded
}

type ImportRow {
  externalId: String!
  originalValues: JSON!
  sourceRow: Int!
}

type ImportSnapshot {
  byteSize: Int!
  createdAt: String!
  delimiter: ImportDelimiter!
  error: ApiError
  finishedAt: String
  headers: [String!]
  id: ID!
  idColumn: String!
  originalName: String!
  projectId: ID!
  rowCount: Int
  sample: [ImportRow!]!
  sourceHash: String!
  status: ImportSnapshotStatus!
}

enum ImportSnapshotStatus {
  failed
  importing
  pending
  ready
}

"""Objeto JSON de solo lectura."""
scalar JSON

type LocalizedMessage {
  en: String!
  es: String!
}

type LocalizedText {
  en: String!
  es: String!
}

type Mutation {
  createProject(input: CreateProjectInput!): Project!
  deleteImport(id: ID!, projectId: ID!): Boolean!
  deleteProject(id: ID!): Boolean!
  updateMe(input: UpdateMeInput!): User!
  updateProject(id: ID!, input: UpdateProjectInput!): Project!
}

type PageInfo {
  hasMore: Boolean!
  limit: Int!
  offset: Int!
}

type ProblemGroup {
  attribute: String!
  code: String!
  problem: LocalizedText!
  productCount: Int!
  suggestion: LocalizedText!
}

type ProductChange {
  change: ProductChangeKind!
  fields: [ProductFieldChange!]!
  id: ID!
}

enum ProductChangeKind {
  added
  modified
  removed
}

type ProductFieldChange {
  after: String
  before: String
  field: String!
}

type Project {
  channelProfile: ChannelProfile
  configurationStatus: ConfigurationStatus!
  country: String
  createdAt: String!
  currency: String
  id: ID!
  name: String!
}

type Query {
  evaluation(id: ID!, projectId: ID!): Evaluation!
  feed(id: ID!, projectId: ID!): Feed!
  importJob(id: ID!, projectId: ID!): ImportJob!
  importSnapshot(id: ID!, projectId: ID!): ImportSnapshot!
  me: User!
  project(id: ID!): Project!
  projects(limit: Int! = 20, offset: Int! = 0): [Project!]!
  worksheet(id: ID!, organizationId: ID!, projectId: ID!): Worksheet!
}

input UpdateMeInput {
  displayName: String
}

input UpdateProjectInput {
  channelProfile: ChannelProfile
  country: String
  currency: String
  name: String
}

type User {
  createdAt: String!
  displayName: String
  email: String
  id: ID!
  updatedAt: String!
}

type Worksheet {
  columns: [WorksheetColumn!]!
  createdAt: String!
  generation: Int!
  headRevision: WorksheetRevision!
  id: ID!
  mode: String!
  name: String!
  rows(cursor: String, limit: Int, revisionId: ID): WorksheetRowPage!
  schemaVersion: Int!
  workbookId: ID!
}

type WorksheetColumn {
  formula: JSON
  id: ID!
  name: String!
  options: JSON
  position: Int!
  required: Boolean!
  type: String!
}

type WorksheetRevision {
  createdAt: String!
  id: ID!
  rowCount: Int!
  sequence: Int!
}

type WorksheetRowPage {
  items: [JSON!]!
  nextCursor: String
  revisionId: ID!
  schemaVersion: Int!
}
