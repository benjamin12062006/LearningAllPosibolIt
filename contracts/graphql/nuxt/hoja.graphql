# Pantalla «Hoja»: el editor (columnas, filas y vistas) y su historial.
query WorksheetScreen(
  $organizationId: ID!
  $projectId: ID!
  $worksheetId: ID!
  $viewId: ID
  $filter: JSONObject
  $sort: [SortTermInput!]
  $columns: [ID!]
  $cursor: String
) {
  worksheet(organizationId: $organizationId, projectId: $projectId, id: $worksheetId) {
    id
    workbookId
    name
    generation
    schemaVersion
    archivedAt
    workbookArchivedAt
    duplicatedFrom { worksheetId revisionId }
    openedFromCatalog { snapshotId }
    headRevision { id sequence rowCount }
    columns { id name type position required options formula }
    capabilities { write approve }
    rows(viewId: $viewId, filter: $filter, sort: $sort, columns: $columns, cursor: $cursor, limit: 100) {
      items
      nextCursor
      revisionId
      schemaVersion
    }
    savedViews(limit: 50) { items { id name visibility query canEdit } page { hasMore } }
  }
}

query WorksheetHistoryScreen($organizationId: ID!, $projectId: ID!, $worksheetId: ID!) {
  worksheet(organizationId: $organizationId, projectId: $projectId, id: $worksheetId) {
    id
    revisions(limit: 20) { items { id sequence source rowCount changesetId createdBy createdAt } page { hasMore } }
    changesets(limit: 20) { items { id title status source operationCount createdAt } page { hasMore } }
    imports(limit: 10) { items { id format fileBytes excludedRowCount changesetStatus createdAt } page { hasMore } }
    exports(limit: 10) { items { id format rowCount createdAt } page { hasMore } }
    importMappings(limit: 20) { items { id name createdAt } page { hasMore } }
  }
}
